<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SqlOS troubleshooting decision flow</title><desc id="desc">A diagnostic flow from observed symptom through configuration, runtime route, and database evidence checks.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fef2f2"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-opacity=".12"/></filter><style>.eye{font:700 15px system-ui,sans-serif;letter-spacing:2px;fill:#ea580c}.title{font:750 42px system-ui,sans-serif;fill:#111827}.sub{font:400 20px system-ui,sans-serif;fill:#64748b}.h{font:700 20px system-ui,sans-serif;fill:#111827}.p{font:500 16px system-ui,sans-serif;fill:#475569}.num{font:750 22px system-ui,sans-serif;fill:#fff}.done{font:700 20px system-ui,sans-serif;fill:#166534}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="77" class="eye">TROUBLESHOOTING</text><text x="64" y="125" class="title">Follow evidence from symptom to cause</text><text x="64" y="161" class="sub">Change one layer at a time: configuration, route/runtime, then persisted state.</text>
  <g filter="url(#shadow)"><rect x="64" y="224" width="250" height="250" rx="22" fill="#fff"/><rect x="365" y="224" width="250" height="250" rx="22" fill="#fff"/><rect x="666" y="224" width="250" height="250" rx="22" fill="#fff"/><rect x="967" y="224" width="249" height="250" rx="22" fill="#fff"/></g>
  <circle cx="104" cy="266" r="22" fill="#f97316"/><text x="104" y="274" text-anchor="middle" class="num">1</text><text x="140" y="273" class="h">Name the symptom</text><text x="88" y="326" class="p">Connection refused?</text><text x="88" y="358" class="p">Callback mismatch?</text><text x="88" y="390" class="p">Empty FGA result?</text><text x="88" y="422" class="p">Dashboard denied?</text>
  <circle cx="405" cy="266" r="22" fill="#f97316"/><text x="405" y="274" text-anchor="middle" class="num">2</text><text x="441" y="273" class="h">Check configuration</text><text x="389" y="326" class="p">Connection string</text><text x="389" y="358" class="p">Issuer + public origin</text><text x="389" y="390" class="p">Redirect URI</text><text x="389" y="422" class="p">Dashboard auth mode</text>
  <circle cx="706" cy="266" r="22" fill="#f97316"/><text x="706" y="274" text-anchor="middle" class="num">3</text><text x="742" y="273" class="h">Verify runtime</text><text x="690" y="326" class="p">AppHost resource status</text><text x="690" y="358" class="p">Mapped /sqlos routes</text><text x="690" y="390" class="p">Provider callback URL</text><text x="690" y="422" class="p">Server logs</text>
  <circle cx="1007" cy="266" r="22" fill="#f97316"/><text x="1007" y="274" text-anchor="middle" class="num">4</text><text x="1043" y="273" class="h">Inspect evidence</text><text x="991" y="326" class="p">SqlOS tables</text><text x="991" y="358" class="p">Audit events</text><text x="991" y="390" class="p">Access Tester</text><text x="991" y="422" class="p">Exact error response</text>
  <path d="M314 349h51M615 349h51M916 349h51" stroke="#fdba74" stroke-width="6" stroke-linecap="round"/><path d="m352 337 13 12-13 12m301-24 13 12-13 12m301-24 13 12-13 12" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <rect x="390" y="548" width="500" height="90" rx="24" fill="#dcfce7" stroke="#86efac"/><text x="640" y="587" text-anchor="middle" class="done">Cause isolated · fix verified</text><text x="640" y="616" text-anchor="middle" class="p">Capture the working route, configuration, and test as the regression proof.</text>
</svg>
