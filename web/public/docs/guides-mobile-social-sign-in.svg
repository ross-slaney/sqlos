<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mobile social sign-in</title><desc id="desc">A mobile app starts native headless auth, opens a social provider, and returns through an app link to exchange a PKCE authorization code.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0284c7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".14"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#0369a1}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 19px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.btn{font:700 14px system-ui;fill:#111827}.url{font:700 13px system-ui;fill:#111827}.white{font:700 14px system-ui;fill:#fff}.step{font:700 13px system-ui;fill:#4338ca}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">MOBILE SOCIAL SIGN-IN</text><text x="64" y="124" class="title">Provider UX outside. OAuth state inside SqlOS.</text><text x="64" y="159" class="sub">Trailnote uses native headless auth, an external browser, an app link, and PKCE.</text>
  <g filter="url(#s)"><rect x="92" y="212" width="330" height="438" rx="44" fill="#111827"/><rect x="107" y="227" width="300" height="408" rx="32" fill="#fff"/><rect x="825" y="212" width="363" height="438" rx="26" fill="#fff"/></g><rect x="197" y="227" width="120" height="21" rx="11" fill="#111827"/>
  <circle cx="153" cy="285" r="18" fill="url(#brand)"/><path d="M146 285h14m-7-7v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="182" y="291" class="h">TRAILNOTE</text><text x="143" y="354" class="h">Continue to your account</text><text x="143" y="382" class="p">Your password stays with your provider.</text>
  <rect x="143" y="422" width="228" height="56" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="171" cy="450" r="12" fill="#111827"/><text x="197" y="456" class="btn">Continue with Apple</text><rect x="143" y="492" width="228" height="56" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="171" cy="520" r="12" fill="#4285f4"/><text x="197" y="526" class="btn">Continue with Google</text><text x="257" y="590" text-anchor="middle" class="p">Protected by PKCE + state</text>
  <path d="M422 430h147" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/><path d="m552 416 17 14-17 14" fill="none" stroke="#0284c7" stroke-width="5"/><rect x="486" y="369" width="210" height="122" rx="22" fill="#fff" stroke="#bae6fd" filter="url(#s)"/><text x="591" y="405" text-anchor="middle" class="step">EXTERNAL BROWSER</text><text x="591" y="437" text-anchor="middle" class="h">Provider consent</text><text x="591" y="465" text-anchor="middle" class="p">OIDC callback → SqlOS</text><path d="M696 430h129" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/><path d="m808 416 17 14-17 14" fill="none" stroke="#4f46e5" stroke-width="5"/>
  <text x="861" y="263" class="step">VERIFIED APP CALLBACK</text><text x="861" y="302" class="url">https://app.trailnote.test/auth/callback</text><rect x="861" y="337" width="291" height="74" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="882" y="366" class="p">1. Verify returned state</text><text x="882" y="392" class="p">2. Read authorization code</text><rect x="861" y="431" width="291" height="74" rx="15" fill="#eef2ff" stroke="#c7d2fe"/><text x="882" y="460" class="p">3. Exchange code + verifier</text><text x="882" y="486" class="p">4. Store refresh token securely</text><rect x="861" y="537" width="291" height="58" rx="15" fill="url(#brand)"/><text x="1007" y="572" text-anchor="middle" class="white">SIGNED IN</text>
</svg>
