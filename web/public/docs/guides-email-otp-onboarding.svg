<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Passwordless email-code onboarding</title><desc id="desc">Two original ParcelPilot screens show entering an email address and verifying a six-digit code to create an account.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fefce8"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ca8a04"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".14"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#c2410c}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 21px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.label{font:700 12px system-ui;letter-spacing:1px;fill:#475569}.input{font:500 16px system-ui;fill:#111827}.white{font:700 15px system-ui;fill:#fff}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">PASSWORDLESS EMAIL-CODE ONBOARDING</text><text x="64" y="124" class="title">No password before the first useful moment</text><text x="64" y="159" class="sub">ParcelPilot verifies an inbox, creates the user, and returns through the same OAuth transaction.</text>
  <g filter="url(#s)"><rect x="118" y="220" width="425" height="410" rx="28" fill="#fff"/><rect x="737" y="220" width="425" height="410" rx="28" fill="#fff"/></g>
  <rect x="152" y="252" width="52" height="52" rx="15" fill="url(#brand)"/><path d="M164 267h28v21h-28z" fill="none" stroke="#fff" stroke-width="3"/><path d="m165 269 13 10 13-10" fill="none" stroke="#fff" stroke-width="3"/><text x="220" y="284" class="h">PARCELPILOT</text><text x="152" y="350" class="h">Create your workspace</text><text x="152" y="379" class="p">We’ll email a short-lived sign-up code.</text><text x="152" y="427" class="label">WORK EMAIL</text><rect x="152" y="441" width="357" height="58" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="174" y="477" class="input">alex@northwind.test</text><rect x="152" y="523" width="357" height="58" rx="14" fill="url(#brand)"/><text x="330" y="559" text-anchor="middle" class="white">EMAIL MY CODE</text><text x="330" y="607" text-anchor="middle" class="p">No password required</text>
  <path d="M543 425h194" stroke="#fdba74" stroke-width="6" stroke-linecap="round"/><path d="m719 411 18 14-18 14" fill="none" stroke="#f97316" stroke-width="5"/>
  <rect x="771" y="252" width="52" height="52" rx="15" fill="url(#brand)"/><path d="M783 267h28v21h-28z" fill="none" stroke="#fff" stroke-width="3"/><path d="m784 269 13 10 13-10" fill="none" stroke="#fff" stroke-width="3"/><text x="839" y="284" class="h">PARCELPILOT</text><text x="771" y="350" class="h">Check your inbox</text><text x="771" y="379" class="p">Code sent to a•••@northwind.test</text><text x="771" y="427" class="label">SIX-DIGIT CODE</text><g fill="#f8fafc" stroke="#cbd5e1"><rect x="771" y="441" width="48" height="58" rx="12"/><rect x="828" y="441" width="48" height="58" rx="12"/><rect x="885" y="441" width="48" height="58" rx="12"/><rect x="942" y="441" width="48" height="58" rx="12"/><rect x="999" y="441" width="48" height="58" rx="12"/><rect x="1056" y="441" width="48" height="58" rx="12"/></g><g class="input" text-anchor="middle"><text x="795" y="478">6</text><text x="852" y="478">3</text><text x="909" y="478">0</text><text x="966" y="478">8</text><text x="1023" y="478">2</text><text x="1080" y="478">4</text></g><rect x="771" y="523" width="333" height="58" rx="14" fill="url(#brand)"/><text x="937" y="559" text-anchor="middle" class="white">CREATE ACCOUNT</text><text x="937" y="607" text-anchor="middle" class="p">Resend available in 24 seconds</text>
</svg>
