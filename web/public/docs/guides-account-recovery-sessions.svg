<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Account recovery and device sessions</title><desc id="desc">A recovery flow resets a password, revokes active sessions, and preserves an audit trail.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".13"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#c2410c}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 19px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.danger{font:700 13px system-ui;fill:#b91c1c}.ok{font:700 13px system-ui;fill:#166534}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">ACCOUNT RECOVERY &amp; DEVICE SESSIONS</text><text x="64" y="124" class="title">Recovery ends with control restored</text><text x="64" y="159" class="sub">Harbor resets the credential, revokes untrusted sessions, and leaves evidence for support.</text>
  <g filter="url(#s)"><rect x="64" y="222" width="376" height="416" rx="26" fill="#fff"/><rect x="470" y="222" width="746" height="416" rx="26" fill="#fff"/></g>
  <text x="94" y="267" class="h">Recover account</text><text x="94" y="299" class="p">Send a generic response whether or not</text><text x="94" y="322" class="p">the email belongs to an active account.</text><text x="94" y="370" class="p">EMAIL</text><rect x="94" y="385" width="316" height="56" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><text x="114" y="420" class="p">alex@example.test</text><rect x="94" y="463" width="316" height="56" rx="13" fill="#111827"/><text x="252" y="498" text-anchor="middle" fill="#fff" class="h">SEND RECOVERY LINK</text><rect x="94" y="553" width="316" height="48" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="252" y="583" text-anchor="middle" class="ok">✓ New password accepted</text>
  <text x="500" y="267" class="h">Active sessions</text><text x="1129" y="267" text-anchor="end" class="danger">REVOKE ALL OTHERS</text>
  <g><rect x="500" y="300" width="686" height="82" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="535" cy="341" r="18" fill="#dbeafe"/><rect x="528" y="329" width="14" height="24" rx="3" fill="#2563eb"/><text x="571" y="332" class="h">iPhone · Current device</text><text x="571" y="359" class="p">Seattle, US · active now</text><rect x="1074" y="322" width="88" height="38" rx="19" fill="#dcfce7"/><text x="1118" y="346" text-anchor="middle" class="ok">KEEP</text>
  <rect x="500" y="399" width="686" height="82" rx="15" fill="#fff" stroke="#e2e8f0"/><circle cx="535" cy="440" r="18" fill="#e2e8f0"/><rect x="523" y="432" width="24" height="15" rx="2" fill="#64748b"/><text x="571" y="431" class="h">Chrome on macOS</text><text x="571" y="458" class="p">Portland, US · 2 hours ago</text><rect x="1074" y="421" width="88" height="38" rx="19" fill="#fee2e2"/><text x="1118" y="445" text-anchor="middle" class="danger">REVOKE</text>
  <rect x="500" y="498" width="686" height="82" rx="15" fill="#fff" stroke="#e2e8f0"/><circle cx="535" cy="539" r="18" fill="#e2e8f0"/><rect x="527" y="527" width="16" height="24" rx="3" fill="#64748b"/><text x="571" y="530" class="h">Android</text><text x="571" y="557" class="p">Unknown location · yesterday</text><rect x="1074" y="520" width="88" height="38" rx="19" fill="#fee2e2"/><text x="1118" y="544" text-anchor="middle" class="danger">REVOKE</text></g>
  <rect x="650" y="606" width="386" height="48" rx="14" fill="#ffedd5" stroke="#fdba74"/><text x="843" y="636" text-anchor="middle" class="p">Audit: reset completed · sessions revoked</text>
</svg>
