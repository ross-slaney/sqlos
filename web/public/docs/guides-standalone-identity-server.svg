<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Standalone SqlOS identity server topology</title><desc id="desc">Web, mobile, and CLI clients authenticate through one SqlOS auth host which issues audience-bound tokens to resource APIs.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".13"/></filter><style>.eye{font:700 15px system-ui,sans-serif;letter-spacing:2px;fill:#6366f1}.title{font:750 42px system-ui,sans-serif;fill:#111827}.sub{font:400 20px system-ui,sans-serif;fill:#64748b}.h{font:700 21px system-ui,sans-serif;fill:#111827}.p{font:500 16px system-ui,sans-serif;fill:#475569}.label{font:600 13px system-ui,sans-serif;fill:#475569}.white{font:700 22px system-ui,sans-serif;fill:#fff}.smallwhite{font:500 15px system-ui,sans-serif;fill:#e0e7ff}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="77" class="eye">STANDALONE IDENTITY SERVER</text><text x="64" y="125" class="title">One auth host. Every application surface.</text><text x="64" y="161" class="sub">Centralize identity while each API continues to enforce its own audience and authorization.</text>
  <g filter="url(#shadow)"><rect x="64" y="238" width="250" height="105" rx="22" fill="#fff"/><rect x="64" y="380" width="250" height="105" rx="22" fill="#fff"/><rect x="64" y="522" width="250" height="105" rx="22" fill="#fff"/></g>
  <text x="94" y="278" class="h">Web application</text><text x="94" y="309" class="p">Authorization code + PKCE</text><text x="94" y="420" class="h">Mobile application</text><text x="94" y="451" class="p">Custom URI callback + PKCE</text><text x="94" y="562" class="h">CLI / device</text><text x="94" y="593" class="p">Device authorization flow</text>
  <rect x="450" y="260" width="380" height="340" rx="32" fill="url(#brand)" filter="url(#shadow)"/><rect x="596" y="294" width="88" height="74" rx="22" fill="#fff" fill-opacity=".18"/><text x="640" y="340" text-anchor="middle" class="white">SO</text><text x="640" y="410" text-anchor="middle" class="white">SqlOS Auth Host</text><text x="640" y="446" text-anchor="middle" class="smallwhite">/sqlos/auth/*</text><text x="640" y="477" text-anchor="middle" class="smallwhite">/sqlos/admin/auth</text><text x="640" y="520" text-anchor="middle" class="smallwhite">clients · users · orgs · sessions</text><text x="640" y="551" text-anchor="middle" class="smallwhite">assignments · keys · policies</text>
  <g filter="url(#shadow)"><rect x="966" y="275" width="250" height="120" rx="22" fill="#fff"/><rect x="966" y="465" width="250" height="120" rx="22" fill="#fff"/></g><text x="996" y="319" class="h">Resource API A</text><text x="996" y="350" class="p">Validate issuer + audience</text><text x="996" y="509" class="h">Resource API B</text><text x="996" y="540" class="p">Validate issuer + audience</text>
  <path d="M314 290h136M314 432h136M314 574h136M830 366h136M830 496h136" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/><path d="m437 279 13 11-13 11m0 120 13 11-13 11m0 120 13 11-13 11m516-219 13 11-13 11m0 119 13 11-13 11" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <text x="382" y="274" text-anchor="middle" class="label">authenticate</text><text x="898" y="348" text-anchor="middle" class="label">audience token</text><text x="898" y="478" text-anchor="middle" class="label">audience token</text>
</svg>
