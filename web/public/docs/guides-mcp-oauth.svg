<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">OAuth for an MCP client</title><desc id="desc">An MCP client discovers protected resource metadata, resolves authorization-server metadata, identifies itself through CIMD, requests a resource-bound token, and calls an MCP server.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity=".12"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#0e7490}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 18px system-ui;fill:#111827}.p{font:500 14px system-ui;fill:#64748b}.code{font:600 13px ui-monospace,monospace;fill:#155e75}.claim{font:600 11px ui-monospace,monospace;fill:#155e75}.n{font:750 17px system-ui;fill:#fff}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">OAUTH FOR MCP CLIENTS</text><text x="64" y="124" class="title">Discovery first. Resource-bound token last.</text><text x="64" y="159" class="sub">Taskrail MCP publishes the metadata an OAuth client needs without a registration ceremony.</text>
  <g filter="url(#s)"><rect x="64" y="237" width="220" height="294" rx="24" fill="#fff"/><rect x="330" y="237" width="220" height="294" rx="24" fill="#fff"/><rect x="596" y="237" width="220" height="294" rx="24" fill="#fff"/><rect x="862" y="237" width="354" height="294" rx="24" fill="#fff"/></g>
  <circle cx="102" cy="278" r="21" fill="#0891b2"/><text x="102" y="284" text-anchor="middle" class="n">1</text><text x="137" y="284" class="h">Discover resource</text><text x="88" y="335" class="p">MCP server publishes:</text><rect x="88" y="361" width="172" height="82" rx="12" fill="#ecfeff" stroke="#a5f3fc"/><text x="102" y="389" class="code">/.well-known/</text><text x="102" y="412" class="code">oauth-protected-</text><text x="102" y="435" class="code">resource</text><text x="88" y="481" class="p">resource + auth servers</text>
  <circle cx="368" cy="278" r="21" fill="#0891b2"/><text x="368" y="284" text-anchor="middle" class="n">2</text><text x="403" y="284" class="h">Identify client</text><text x="354" y="335" class="p">Client ID is an HTTPS URL:</text><rect x="354" y="361" width="172" height="82" rx="12" fill="#ecfeff" stroke="#a5f3fc"/><text x="368" y="384" class="code">https://client.</text><text x="368" y="407" class="code">taskrail.test/</text><text x="368" y="430" class="code">oauth-client.json</text><text x="354" y="481" class="p">CIMD declares callbacks</text>
  <circle cx="634" cy="278" r="21" fill="#4f46e5"/><text x="634" y="284" text-anchor="middle" class="n">3</text><text x="669" y="284" class="h">Authorize</text><text x="620" y="335" class="p">Authorization request includes:</text><rect x="620" y="361" width="172" height="82" rx="12" fill="#eef2ff" stroke="#c7d2fe"/><text x="634" y="389" class="code">resource=</text><text x="634" y="412" class="code">https://mcp.</text><text x="634" y="435" class="code">taskrail.test</text><text x="620" y="481" class="p">PKCE + exact redirect URI</text>
  <circle cx="900" cy="278" r="21" fill="#4f46e5"/><text x="900" y="284" text-anchor="middle" class="n">4</text><text x="935" y="284" class="h">Call tools</text><text x="886" y="335" class="p">SqlOS access token:</text><rect x="886" y="361" width="306" height="82" rx="12" fill="#eef2ff" stroke="#c7d2fe"/><text x="904" y="389" class="claim">iss: https://auth.taskrail.test/sqlos/auth</text><text x="904" y="412" class="claim">aud: https://mcp.taskrail.test</text><text x="904" y="435" class="claim">sid: ssn_taskrail_01</text><rect x="886" y="467" width="306" height="42" rx="12" fill="#dcfce7"/><text x="1039" y="493" text-anchor="middle" fill="#166534" class="h">✓ MCP request accepted</text>
  <path d="M284 384h46M550 384h46M816 384h46" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/><path d="m315 372 15 12-15 12m266-24 15 12-15 12m266-24 15 12-15 12" fill="none" stroke="#0891b2" stroke-width="4"/>
  <rect x="304" y="584" width="672" height="70" rx="20" fill="#fff" stroke="#a5f3fc"/><text x="640" y="613" text-anchor="middle" class="h">Keep the audience narrow</text><text x="640" y="639" text-anchor="middle" class="p">A token minted for one MCP resource must not authorize another API.</text>
</svg>
