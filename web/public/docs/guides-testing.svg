<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SqlOS testing pipeline</title><desc id="desc">Build, unit tests, integration tests, documentation checks, and merge coverage flow into a green pull request.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".3"/></filter><style>.eyebrow{font:700 15px system-ui,sans-serif;letter-spacing:2px;fill:#a5b4fc}.title{font:750 44px system-ui,sans-serif;fill:#fff}.sub{font:400 20px system-ui,sans-serif;fill:#cbd5e1}.step{font:700 20px system-ui,sans-serif;fill:#0f172a}.cmd{font:500 15px ui-monospace,SFMono-Regular,monospace;fill:#475569}.ok{font:700 16px system-ui,sans-serif;fill:#166534}.merge{font:750 28px system-ui,sans-serif;fill:#fff}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="77" class="eyebrow">TESTING</text><text x="64" y="125" class="title">One local sequence. The same merge gates.</text><text x="64" y="161" class="sub">Run the fast checks first, then let integration and coverage prove the complete system.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="220" width="252" height="230" rx="22" fill="#fff"/><rect x="348" y="220" width="252" height="230" rx="22" fill="#fff"/><rect x="632" y="220" width="252" height="230" rx="22" fill="#fff"/><rect x="916" y="220" width="300" height="230" rx="22" fill="#fff"/>
  </g>
  <circle cx="104" cy="263" r="22" fill="#6366f1"/><text x="104" y="270" text-anchor="middle" class="merge">1</text><text x="140" y="271" class="step">Build</text><text x="88" y="326" class="cmd">dotnet build</text><rect x="88" y="365" width="204" height="44" rx="12" fill="#dcfce7"/><text x="190" y="393" text-anchor="middle" class="ok">✓ Compiles cleanly</text>
  <circle cx="388" cy="263" r="22" fill="#6366f1"/><text x="388" y="270" text-anchor="middle" class="merge">2</text><text x="424" y="271" class="step">Unit tests</text><text x="372" y="326" class="cmd">SqlOS.Tests</text><rect x="372" y="365" width="204" height="44" rx="12" fill="#dcfce7"/><text x="474" y="393" text-anchor="middle" class="ok">✓ Fast feedback</text>
  <circle cx="672" cy="263" r="22" fill="#6366f1"/><text x="672" y="270" text-anchor="middle" class="merge">3</text><text x="708" y="271" class="step">Integration</text><text x="656" y="326" class="cmd">SqlOS.IntegrationTests</text><rect x="656" y="365" width="204" height="44" rx="12" fill="#dcfce7"/><text x="758" y="393" text-anchor="middle" class="ok">✓ SQL + runtime</text>
  <circle cx="956" cy="263" r="22" fill="#6366f1"/><text x="956" y="270" text-anchor="middle" class="merge">4</text><text x="992" y="271" class="step">Docs + coverage</text><text x="940" y="316" class="cmd">./scripts/docs-check.sh</text><text x="940" y="343" class="cmd">Merge Coverage</text><rect x="940" y="365" width="252" height="44" rx="12" fill="#dcfce7"/><text x="1066" y="393" text-anchor="middle" class="ok">✓ Contracts stay true</text>
  <path d="M316 335h32M600 335h32M884 335h32" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
  <rect x="395" y="525" width="490" height="112" rx="28" fill="#22c55e" filter="url(#shadow)"/><text x="640" y="571" text-anchor="middle" class="merge">Pull request ready</text><text x="640" y="605" text-anchor="middle" class="sub" fill="#ecfdf5">Build · Unit · Integration · Docs · Coverage</text>
</svg>
