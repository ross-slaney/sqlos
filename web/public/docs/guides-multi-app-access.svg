<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Multi-application access assignments</title><desc id="desc">One organization has explicit assignments to a customer portal, operations console, and mobile application behind a shared SqlOS identity host.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".13"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#5b21b6}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 19px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.white{font:700 20px system-ui;fill:#fff}.small{font:500 14px system-ui;fill:#e0e7ff}.ok{font:700 13px system-ui;fill:#166534}.deny{font:700 13px system-ui;fill:#b91c1c}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">MULTI-APP ACCESS ASSIGNMENTS</text><text x="64" y="124" class="title">A valid identity is not automatic app access</text><text x="64" y="159" class="sub">Atlas Suite separates client registration, application availability, and in-app authorization.</text>
  <rect x="72" y="258" width="278" height="326" rx="28" fill="#fff" stroke="#ddd6fe" filter="url(#s)"/><text x="106" y="304" class="h">Northwind organization</text><text x="106" y="334" class="p">Plan: Enterprise</text><text x="106" y="361" class="p">Members: 42</text><text x="106" y="405" class="h">Assignments</text><rect x="106" y="427" width="210" height="43" rx="12" fill="#dcfce7"/><text x="211" y="454" text-anchor="middle" class="ok">Customer Portal · allowed</text><rect x="106" y="480" width="210" height="43" rx="12" fill="#dcfce7"/><text x="211" y="507" text-anchor="middle" class="ok">Mobile App · allowed</text><rect x="106" y="533" width="210" height="43" rx="12" fill="#fee2e2"/><text x="211" y="560" text-anchor="middle" class="deny">Ops Console · denied</text>
  <rect x="465" y="268" width="350" height="306" rx="30" fill="url(#brand)" filter="url(#s)"/><rect x="592" y="302" width="96" height="76" rx="22" fill="#fff" fill-opacity=".17"/><text x="640" y="349" text-anchor="middle" class="white">SO</text><text x="640" y="424" text-anchor="middle" class="white">SqlOS Identity Host</text><text x="640" y="459" text-anchor="middle" class="small">users · organizations · clients</text><text x="640" y="487" text-anchor="middle" class="small">applications · assignments · sessions</text><rect x="536" y="517" width="208" height="36" rx="18" fill="#fff" fill-opacity=".16"/><text x="640" y="540" text-anchor="middle" class="small">check before issuing access</text>
  <g filter="url(#s)"><rect x="930" y="218" width="278" height="112" rx="22" fill="#fff"/><rect x="930" y="365" width="278" height="112" rx="22" fill="#fff"/><rect x="930" y="512" width="278" height="112" rx="22" fill="#fff"/></g><text x="964" y="261" class="h">Customer Portal</text><text x="964" y="293" class="ok">✓ organization assigned</text><text x="964" y="408" class="h">Mobile App</text><text x="964" y="440" class="ok">✓ organization assigned</text><text x="964" y="555" class="h">Ops Console</text><text x="964" y="587" class="deny">× no assignment</text>
  <path d="M350 421h115M815 275h115M815 421h115M815 568h115" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/><path d="m449 408 16 13-16 13m465-172 16 13-16 13m0 120 16 13-16 13m0 121 16 13-16 13" fill="none" stroke="#7c3aed" stroke-width="4"/>
</svg>
