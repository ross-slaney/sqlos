<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Invite-only B2B onboarding</title><desc id="desc">An invitation moves through delivery, identity verification, organization membership, and audit confirmation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity=".12"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#6d28d9}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 19px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.n{font:750 18px system-ui;fill:#fff}.pill{font:700 13px system-ui;fill:#166534}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">INVITE-ONLY B2B ONBOARDING</text><text x="64" y="124" class="title">The invitation is the trust boundary</text><text x="64" y="159" class="sub">Atlas Workspace grants membership only after the invited identity completes the bound flow.</text>
  <g filter="url(#s)"><rect x="64" y="232" width="245" height="285" rx="24" fill="#fff"/><rect x="366" y="232" width="245" height="285" rx="24" fill="#fff"/><rect x="668" y="232" width="245" height="285" rx="24" fill="#fff"/><rect x="970" y="232" width="246" height="285" rx="24" fill="#fff"/></g>
  <circle cx="104" cy="274" r="22" fill="url(#brand)"/><text x="104" y="281" text-anchor="middle" class="n">1</text><text x="140" y="281" class="h">Invite</text><text x="88" y="335" class="p">Admin chooses organization,</text><text x="88" y="360" class="p">email, role, and expiry.</text><rect x="88" y="406" width="197" height="58" rx="14" fill="#faf5ff" stroke="#ddd6fe"/><text x="104" y="431" class="p">alex@northwind.test</text><text x="104" y="451" class="p">Role: member</text>
  <circle cx="406" cy="274" r="22" fill="url(#brand)"/><text x="406" y="281" text-anchor="middle" class="n">2</text><text x="442" y="281" class="h">Accept</text><text x="390" y="335" class="p">Single-use token binds the</text><text x="390" y="360" class="p">browser to this invitation.</text><path d="M416 411h145v-44l32 68-32 68v-44H416z" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <circle cx="708" cy="274" r="22" fill="url(#brand)"/><text x="708" y="281" text-anchor="middle" class="n">3</text><text x="744" y="281" class="h">Verify identity</text><text x="692" y="335" class="p">Password, email code, or</text><text x="692" y="360" class="p">organization SSO completes.</text><rect x="692" y="405" width="197" height="60" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="790" y="431" text-anchor="middle" class="h">••••••</text><text x="790" y="451" text-anchor="middle" class="p">one-time code</text>
  <circle cx="1010" cy="274" r="22" fill="url(#brand)"/><text x="1010" y="281" text-anchor="middle" class="n">4</text><text x="1046" y="281" class="h">Grant membership</text><text x="994" y="335" class="p">SqlOS creates or links the</text><text x="994" y="360" class="p">user only after verification.</text><rect x="994" y="405" width="198" height="60" rx="14" fill="#dcfce7" stroke="#86efac"/><text x="1093" y="441" text-anchor="middle" class="pill">✓ ACTIVE MEMBER</text>
  <path d="M309 374h57M611 374h57M913 374h57" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/><path d="m350 362 16 12-16 12m302-24 16 12-16 12m302-24 16 12-16 12" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <rect x="314" y="574" width="652" height="82" rx="22" fill="#fff" stroke="#ddd6fe"/><text x="640" y="607" text-anchor="middle" class="h">Auditable outcome</text><text x="640" y="635" text-anchor="middle" class="p">invitation sent · identity verified · membership created · role assigned</text>
</svg>
