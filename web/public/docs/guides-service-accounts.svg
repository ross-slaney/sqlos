<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Background jobs with service accounts</title><desc id="desc">A scheduler authenticates as a service account, receives scoped authority, passes an FGA check, and calls a protected API.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity=".12"/></filter><style>.eye{font:700 15px system-ui;letter-spacing:2px;fill:#047857}.title{font:750 42px system-ui;fill:#111827}.sub{font:400 19px system-ui;fill:#64748b}.h{font:700 19px system-ui;fill:#111827}.p{font:500 15px system-ui;fill:#64748b}.white{font:700 15px system-ui;fill:#fff}.tag{font:700 13px ui-monospace,monospace;fill:#065f46}</style></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/><text x="64" y="76" class="eye">SERVICE ACCOUNTS FOR BACKGROUND JOBS</text><text x="64" y="124" class="title">Give automation an identity, not a user token</text><text x="64" y="159" class="sub">LedgerOps runs a nightly export with a rotatable credential and the smallest useful FGA grant.</text>
  <g filter="url(#s)"><rect x="64" y="257" width="235" height="250" rx="24" fill="#fff"/><rect x="359" y="257" width="235" height="250" rx="24" fill="#fff"/><rect x="654" y="257" width="235" height="250" rx="24" fill="#fff"/><rect x="949" y="257" width="267" height="250" rx="24" fill="#fff"/></g>
  <circle cx="105" cy="302" r="24" fill="#d1fae5"/><path d="M94 302h22m-11-11v22" stroke="#059669" stroke-width="4" stroke-linecap="round"/><text x="140" y="309" class="h">Scheduler</text><text x="88" y="365" class="p">Nightly at 02:00 UTC</text><rect x="88" y="400" width="187" height="54" rx="13" fill="#f0fdf4" stroke="#a7f3d0"/><text x="181" y="433" text-anchor="middle" class="tag">export-ledger</text>
  <circle cx="400" cy="302" r="24" fill="url(#brand)"/><path d="M390 302h20m-10-10v20" stroke="#fff" stroke-width="4"/><text x="435" y="309" class="h">Service account</text><text x="383" y="359" class="p">ledger-exporter</text><text x="383" y="386" class="p">Credential expires in 30d</text><rect x="383" y="418" width="187" height="42" rx="12" fill="#dcfce7"/><text x="476" y="444" text-anchor="middle" class="tag">ROTATABLE</text>
  <circle cx="695" cy="302" r="24" fill="#dbeafe"/><path d="M684 306h22v-14h-22z" fill="#2563eb"/><text x="730" y="309" class="h">FGA grant</text><text x="678" y="359" class="p">Resource: ledger::northwind</text><text x="678" y="386" class="p">Role: export_reader</text><rect x="678" y="418" width="187" height="42" rx="12" fill="#dbeafe"/><text x="771" y="444" text-anchor="middle" class="tag">LEDGER_EXPORT</text>
  <circle cx="990" cy="302" r="24" fill="#e0e7ff"/><path d="M979 291h22v22h-22z" fill="#4f46e5"/><text x="1025" y="309" class="h">Protected API</text><text x="973" y="359" class="p">Validates credential</text><text x="973" y="386" class="p">Checks exact permission</text><rect x="973" y="418" width="219" height="42" rx="12" fill="url(#brand)"/><text x="1082" y="444" text-anchor="middle" class="white">EXPORT ALLOWED</text>
  <path d="M299 382h60M594 382h60M889 382h60" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/><path d="m343 369 16 13-16 13m295-26 16 13-16 13m295-26 16 13-16 13" fill="none" stroke="#059669" stroke-width="4"/>
  <rect x="318" y="568" width="644" height="77" rx="22" fill="#fff" stroke="#a7f3d0"/><text x="640" y="599" text-anchor="middle" class="h">Operational contract</text><text x="640" y="627" text-anchor="middle" class="p">no shared user session · scoped grant · credential rotation · audit on every mutation</text>
</svg>
