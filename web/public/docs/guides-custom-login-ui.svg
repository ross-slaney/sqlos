<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Custom login UI using the SqlOS headless state machine</title>
  <desc id="desc">A RelayDesk browser interface renders identify, password, organization, and MFA views returned by SqlOS, then completes an OAuth callback with PKCE.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="90" r="150" fill="#c4b5fd" opacity="0.23"/>
  <circle cx="110" cy="620" r="190" fill="#bfdbfe" opacity="0.24"/>

  <text x="72" y="76" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Product-owned screens. Server-owned decisions.</text>
  <text x="72" y="112" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">RelayDesk renders each view; SqlOS preserves OAuth, tenant, and MFA boundaries.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="162" width="420" height="420" rx="24" fill="#ffffff"/>
    <rect x="72" y="162" width="420" height="74" rx="24" fill="url(#brand)"/>
    <path d="M72 212h420v24H72z" fill="url(#brand)"/>
    <circle cx="112" cy="199" r="14" fill="#ffffff" opacity="0.94"/>
    <path d="M106 199h12M112 193v12" stroke="#5b21b6" stroke-width="2.4" stroke-linecap="round"/>
    <text x="138" y="206" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">RelayDesk</text>

    <text x="112" y="286" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">Welcome back</text>
    <text x="112" y="318" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Continue with your work email</text>
    <text x="112" y="365" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">EMAIL ADDRESS</text>
    <rect x="112" y="381" width="340" height="54" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="132" y="415" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">avery@northwind.test</text>
    <rect x="112" y="456" width="340" height="56" rx="12" fill="url(#brand)"/>
    <text x="282" y="491" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Continue</text>
    <text x="282" y="548" text-anchor="middle" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Your app owns this presentation</text>
  </g>

  <path d="M520 318 C566 318 570 276 620 276" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M620 474 C570 474 566 432 520 432" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="555" y="292" text-anchor="middle" fill="#4f46e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">ACTION</text>
  <text x="555" y="462" text-anchor="middle" fill="#4f46e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">NEXT VIEW</text>

  <g filter="url(#shadow)">
    <rect x="646" y="162" width="482" height="420" rx="24" fill="#0f172a"/>
    <text x="690" y="208" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">SQL OS HEADLESS AUTH</text>
    <text x="690" y="248" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Server-owned state machine</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">
      <rect x="690" y="286" width="174" height="48" rx="12" fill="#312e81" stroke="#818cf8"/>
      <text x="777" y="316" text-anchor="middle" fill="#e0e7ff">1 · Identify / HRD</text>
      <rect x="910" y="286" width="174" height="48" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="997" y="316" text-anchor="middle" fill="#e2e8f0">2 · Password / SSO</text>
      <path d="M868 310h34" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="690" y="370" width="174" height="48" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="777" y="400" text-anchor="middle" fill="#e2e8f0">3 · Organization</text>
      <rect x="910" y="370" width="174" height="48" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="997" y="400" text-anchor="middle" fill="#e2e8f0">4 · MFA policy</text>
      <path d="M868 394h34" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)"/>
    </g>

    <rect x="690" y="462" width="394" height="76" rx="14" fill="#111c32" stroke="#334155"/>
    <circle cx="726" cy="500" r="18" fill="#22c55e" opacity="0.18"/>
    <path d="M718 500l6 6 11-14" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="758" y="492" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Registered OAuth callback</text>
    <text x="758" y="519" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">state checked · code + original PKCE verifier</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">
    <rect x="376" y="613" width="126" height="34" rx="17" fill="#e0e7ff"/>
    <text x="439" y="635" text-anchor="middle" fill="#4338ca">Custom UI</text>
    <rect x="520" y="613" width="126" height="34" rx="17" fill="#dbeafe"/>
    <text x="583" y="635" text-anchor="middle" fill="#1d4ed8">S256 PKCE</text>
    <rect x="664" y="613" width="146" height="34" rx="17" fill="#dcfce7"/>
    <text x="737" y="635" text-anchor="middle" fill="#15803d">Tenant checks</text>
    <rect x="828" y="613" width="146" height="34" rx="17" fill="#f3e8ff"/>
    <text x="901" y="635" text-anchor="middle" fill="#7e22ce">MFA enforced</text>
  </g>
</svg>
