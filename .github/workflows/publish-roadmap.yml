name: Publish Roadmap Snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roadmap-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Render and publish Value Table
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render roadmap SVG
        run: node scripts/generate-roadmap-svg.mjs
        env:
          # Classic PAT with read:project; fine-grained PATs cannot read user view items.
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ROADMAP_OUTPUT_DIR: _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy roadmap image
        id: deployment
        uses: actions/deploy-pages@v4
