name: Pull Request CI

on:
  pull_request:
    branches: ["**"]

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: chmod +x scripts/*.sh && ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/**
            **/obj/**

  website:
    name: Website and Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: chmod +x scripts/*.sh && ./scripts/docs-check.sh

  headless-package:
    name: Headless JS Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/headless/package-lock.json
            examples/SqlOS.Example.Web/package-lock.json
            examples/SqlOS.Example.AngularWeb/package-lock.json
            examples/SqlOS.Example.ExpoApp/package-lock.json
      - run: chmod +x scripts/*.sh && ./scripts/headless-package-check.sh

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - run: chmod +x scripts/*.sh && ./scripts/unit-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/Unit/**

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - run: docker pull mcr.microsoft.com/mssql/server:2022-latest
        continue-on-error: true
      - run: chmod +x scripts/*.sh && ./scripts/integration-tests.sh
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        # Consent, OpenID Provider, and conformance coverage grew the suite
        # past the previous 30- and 45-minute ceilings.
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/Integration/**

  merge-coverage:
    name: Merge Coverage
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: always() && (needs.unit-tests.result == 'success' || needs.integration-tests.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/Unit
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/Integration
        continue-on-error: true
      - run: chmod +x scripts/*.sh && ./scripts/merge-coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: TestResults/**

  pr-coverage-check:
    name: Coverage Check
    needs: merge-coverage
    runs-on: ubuntu-latest
    if: always() && needs.merge-coverage.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install diff-cover
      - uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: TestResults
      - run: chmod +x scripts/*.sh && ./scripts/pr-coverage-check.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  conformance:
    name: OIDC Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # The OIDF suite has no official image; the harness builds it from source
      # at a pinned tag. Cache the clone (with its maven target) and ~/.m2 keyed
      # by the harness script, which pins SUITE_TAG — bumping the tag invalidates.
      - name: Cache conformance suite build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/oidf-conformance-suite
            ~/.m2
          key: ${{ runner.os }}-oidf-suite-${{ hashFiles('tests/SqlOS.Conformance/run-conformance.sh') }}
      - name: Run OIDCC certification plans
        env:
          SUITE_DIR: ${{ runner.temp }}/oidf-conformance-suite
        run: chmod +x tests/SqlOS.Conformance/run-conformance.sh && ./tests/SqlOS.Conformance/run-conformance.sh
      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            tests/SqlOS.Conformance/export
            tests/SqlOS.Conformance/logs

  e2e:
    name: Sign in with X E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/SqlOS.SignInWithX.AppY/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: npm ci --prefix examples/SqlOS.SignInWithX.AppY
      - run: docker pull mcr.microsoft.com/mssql/server:2022-latest
        continue-on-error: true
      - run: dotnet build examples/SqlOS.SignInWithX.E2eTests --configuration Release
      - name: Install Playwright Chromium
        run: pwsh examples/SqlOS.SignInWithX.E2eTests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test examples/SqlOS.SignInWithX.E2eTests --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
      - name: Upload e2e failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-screenshots
          path: examples/SqlOS.SignInWithX.E2eTests/bin/Release/net9.0/TestResults/**
